# gtklock reads its options from this file, all under the [main] group.
#
# modules is what makes the [playerctl] section below do anything. gtklock only
# reads a module's group when that module is loaded, and the only way to load one
# is this key, so without it the section below was inert.
#
# The module is a separate package, gtklock-playerctl-module, which installs the
# single file /usr/lib/gtklock/playerctl-module.so. The main gtklock package ships
# no modules of its own, so the .so suffix may be omitted and the bare name
# resolves in the system module directory.
#
# The wallpaper on the lock screen is not set here. gtklock's man page says the
# background is a CSS property and that -b can be overridden by the stylesheet,
# so scripts/theme-sync.sh writes background-image into style.css on every
# wallpaper change instead. Doing it there means the three places that start
# gtklock -- the niri keybind, the powermenu entry and the generated systemd unit
# -- do not each have to carry the path.
[main]
modules=playerctl

[playerctl]
art-size=0
position=bottom-center
#
# background is a supported route, but the wallpaper is not set here: gtklock's
# man page says the background is a CSS property and that -b can be overridden by
# the stylesheet, so scripts/theme-sync.sh writes background-image into style.css
# on every wallpaper change instead. Doing it there means the three places that
# start gtklock -- the niri keybind, the powermenu entry and the generated
# systemd unit -- do not each have to carry the path.
