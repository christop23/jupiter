# Vicinae theme - generated by matugen (templates/vicinae.toml).
# Output: ~/.local/share/vicinae/themes/matugen.toml
# Activated with: vicinae theme set matugen

[meta]
name = "Matugen Generated"
description = "Dynamic theme generated from current wallpaper"
<* if {{ is_dark_mode }} *>
variant = "dark"
inherits = "vicinae-dark"
<* else *>
variant = "light"
inherits = "vicinae-light"
<* endif *>
# inherits goes inside the conditional deliberately. An explicit inherits
# overrides the base vicinae derives from variant, so with it outside, a light
# wallpaper produced variant = "light" inheriting the dark base, and every key
# this template does not set came out dark.

# ============================================================================
# Core Colors
# ============================================================================

[colors.core]
accent = "{{colors.primary.default.hex}}"
accent_foreground = "{{colors.on_primary.default.hex}}"
background = "{{colors.background.default.hex}}"
foreground = "{{colors.on_background.default.hex}}"
secondary_background = "{{colors.surface_container.default.hex}}"
border = "{{colors.outline_variant.default.hex}}"

# ============================================================================
# Window-Specific Colors
# ============================================================================

[colors.main_window]
border = "{{colors.outline_variant.default.hex}}"

[colors.settings_window]
border = "{{colors.outline_variant.default.hex}}"

# ============================================================================
# Accent Colors
# ============================================================================

[colors.accents]
blue = "{{colors.primary.default.hex}}"
green = "{{colors.tertiary.default.hex}}"
magenta = "{{colors.tertiary_container.default.hex}}"
orange = "{{colors.secondary.default.hex}}"
red = "{{colors.error.default.hex}}"
yellow = "{{colors.secondary_container.default.hex}}"
cyan = "{{colors.secondary_container.default.hex}}"
purple = "{{colors.tertiary_container.default.hex}}"

# ============================================================================
# Text Colors
# ============================================================================

[colors.text]
default = "{{colors.on_background.default.hex}}"
muted = "{{colors.on_surface_variant.default.hex}}"
danger = "{{colors.error.default.hex}}"
success = "{{colors.tertiary.default.hex}}"
placeholder = "{{colors.outline.default.hex}}"
selection = { background = "{{colors.primary.default.hex}}", foreground = "{{colors.on_primary.default.hex}}" }

[colors.text.links]
default = "{{colors.primary.default.hex}}"
visited = "{{colors.tertiary_container.default.hex}}"

# ============================================================================
# Input Fields
# ============================================================================

[colors.input]
border = "{{colors.outline_variant.default.hex}}"
border_focus = "{{colors.primary.default.hex}}"
border_error = "{{colors.error.default.hex}}"

# ============================================================================
# Buttons
# ============================================================================

[colors.button.primary]
background = "{{colors.surface_container_high.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
hover = { background = "{{colors.surface_container.default.hex}}" }
focus = { outline = "{{colors.primary.default.hex}}" }

# ============================================================================
# Lists
# ============================================================================

[colors.list.item.hover]
background = "{{colors.surface_container.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"

[colors.list.item.selection]
background = "{{colors.surface_container_high.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
secondary_background = "{{colors.surface_container_high.default.hex}}"
secondary_foreground = "{{colors.on_surface.default.hex}}"

# ============================================================================
# Grid Items
# ============================================================================

[colors.grid.item]
background = "{{colors.surface_container_low.default.hex}}"
hover = { outline = "{{colors.outline.default.hex}}" }
selection = { outline = "{{colors.primary.default.hex}}" }

# ============================================================================
# Scrollbars
# ============================================================================

[colors.scrollbars]
background = "{{colors.surface_container.default.hex}}"

# ============================================================================
# Loading Indicators
# ============================================================================

[colors.loading]
bar = "{{colors.primary.default.hex}}"
spinner = "{{colors.primary.default.hex}}"
