# matugen configuration
# Templates live in ./templates, resolved relative to $XDG_CONFIG_HOME/matugen
# rather than to this file, so the directory has to be at
# ~/.config/matugen for the relative paths to work.
#
# theme-sync.sh runs:
#   matugen image <wallpaper> --mode <dark|light> --type scheme-vibrant
#
# The ten values --type accepts on matugen 4.2.0. scheme-vibrant is the one used
# here, for the reason the whole setup exists: the palette should look like the
# wallpaper. Tonal-spot, the default, pulls the source colour toward a muted
# baseline to hit Material's tonal targets, so the result is a palette that
# satisfies a spec rather than one that resembles the picture. scheme-vibrant
# keeps the chroma the image actually has.
#
#   scheme-vibrant        scheme-tonal-spot (the default)   scheme-smart
#   scheme-content        scheme-expressive                 scheme-fidelity
#   scheme-fruit-salad    scheme-monochrome                 scheme-neutral
#                         scheme-rainbow
#
# The list is the binary's, not a guess: `matugen image --help` enumerates it, and
# an unrecognised value is a hard error, so an older matugen without scheme-vibrant
# fails the run rather than quietly generating something else.
#
# NOTE: awww owns the wallpaper itself (bgselector.sh). matugen only
# generates colors + renders the templates below.

[config]
# Which extracted colour to use as the source when an image offers several.
# Independent of the TTY: matugen never prompts, it picks, and --prefer is the
# documented way to change which. The values are darkness, lightness, saturation,
# less-saturation, value and closest-to-fallback. saturation is chosen because it
# does not depend on the image's overall lightness, so the same wallpaper yields
# the same palette in both modes; content and background, the other two
# image-dependent choices, would not.
prefer = "saturation"

[templates.alacritty]
input_path = "templates/alacritty.toml"
output_path = "~/.config/alacritty/colors.toml"

[templates.waybar]
input_path = "templates/waybar.css"
output_path = "~/.config/waybar/colors.css"

# One entry per destination rather than a list of destinations, because matugen
# honours only the last path when output_path is an array and the GTK3 file was
# silently never written.
#
# Both write gtk.css, since that is the only user stylesheet GTK loads: GTK 3 and
# GTK 4 each document that "$XDG_CONFIG_HOME/gtk-<version>/gtk.css is loaded if
# it exists" and nothing else. A file called colors.css was read by nothing.
# matugen owns these paths, which is why theme-sync.sh no longer links
# gtk-4.0/gtk.css into the active theme.
[templates.gtk3]
input_path = "templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.mako]
input_path = "templates/mako"
output_path = "~/.config/mako/config"

[templates.zathura]
input_path = "templates/zathurarc"
output_path = "~/.config/zathura/zathurarc"

[templates.vicinae]
input_path = "templates/vicinae.toml"
output_path = "~/.local/share/vicinae/themes/matugen.toml"

# Pywal-schema JSON cache. Consumed by scripts/theme-sync.sh, for the niri accent
# colour. Nothing else in this setup reads it. It is written to pywal's own cache
# directory because that is the schema the name refers to, not because pywal is
# installed: if you ever install and run it, it will overwrite this file and every
# matugen-templated app will desync from niri with no warning.
[templates.pywal_json]
input_path = "templates/pywal-colors.json"
output_path = "~/.cache/wal/colors.json"
