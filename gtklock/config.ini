# gtklock reads its options from this file, all under the [main] group.
#
# It used to contain a [playerctl] section with art-size and position. That was
# inert twice over: gtklock only reads a module's group when that module is
# loaded, loading needs -m / [main] modules, and gtklock 4.0.0 ships seven files
# with no modules among them. There was no playerctl-module.so to load.
#
# Now media info on the lock screen needs a modules build of gtklock, which Arch
# does not package. Waybar's mpris module covers the same ground and does work.
#
# [main]
# background=/home/USER/Pictures/Wallpapers/<scheme>/<dark|light>/<file>
#
# background is a supported route, but the wallpaper is not set here: gtklock's
# man page says the background is a CSS property and that -b can be overridden by
# the stylesheet, so scripts/theme-sync.sh writes background-image into style.css
# on every wallpaper change instead. Doing it there means the three places that
# start gtklock -- the niri keybind, the powermenu entry and the generated
# systemd unit -- do not each have to carry the path.
