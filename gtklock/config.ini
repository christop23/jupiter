# gtklock reads its options from this file, all under the [main] group. It is
# currently empty of options on purpose.
#
# It used to carry a media section, plus the [main] modules line that would have
# loaded it. Both are gone, because media info on the lock screen is not wanted
# here. Waybar's mpris module shows the same information without a second
# implementation of it.
#
# The wallpaper on the lock screen is not set here either. gtklock's man page
# says the background is a CSS property and that -b can be overridden by the
# stylesheet, so scripts/theme-sync.sh writes background-image into style.css on
# every wallpaper change instead. Doing it there means the three places that
# start gtklock -- the niri keybind, the powermenu entry and the generated
# systemd unit -- do not each have to carry the path.
